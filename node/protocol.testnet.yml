  - seed3t5.neo.org:20333
  - seed4t5.neo.org:20333
  - seed5t5.neo.org:20333
  VerifyTransactions: false
  P2PSigExtensions: false
  Hardforks:
    Aspidochelone: 210000
    Basilisk: 2680000
    Cockatrice: 3967000
    Domovoi: 4144000
    Echidna: 5870000
    Faun: 12960000
    Gorgon: 17960000

ApplicationConfiguration:
  SkipBlockVerification: false
  DBConfiguration:
    Type: leveldb
    LevelDBOptions:
      DataDirectoryPath: /var/lib/ftb-node/chain
  P2P:
    Addresses:
      - ":20333"
    DialTimeout: 3s
    ProtoTickInterval: 2s
    PingInterval: 30s
    PingTimeout: 90s
    MaxPeers: 100
    AttemptConnPeers: 20
    MinPeers: 10
  Relay: true
  # no Consensus / Oracle / P2PNotary: this node never holds or unlocks keys
  Consensus:
    Enabled: false
  Oracle:
    Enabled: false
  P2PNotary:
    Enabled: false
  # RPC is bound to localhost only; Caddy fronts it with TLS and CORS.
  # StartWhenSynchronized: refuse to serve until the chain is fully synced, so
  # front-end failover skips this node while it is catching up (a half-synced node
  # answers "unknown contract" for anything deployed above its height).
  RPC:
    Enabled: true
    Addresses:
      - 127.0.0.1:20332
    MaxGasInvoke: 50
    MaxIteratorResultItems: 100
    StartWhenSynchronized: true
  Prometheus:
    Enabled: false
  Pprof:
    Enabled: false
  # fast bootstrap: fetch historical blocks from NeoFS instead of crawling P2P
  # from genesis (20M+ blocks). worker count kept low for 2 GB VMs.
  NeoFSBlockFetcher:
    Enabled: true
    Addresses:
      - st1.storage.fs.neo.org:8080
      - st2.storage.fs.neo.org:8080
      - st3.storage.fs.neo.org:8080
      - st4.storage.fs.neo.org:8080
    Timeout: 10m
    DownloaderWorkersCount: 100
    OIDBatchSize: 8000
    BQueueSize: 16000
    ContainerID: "A8nGtDemWrm2SjfcGAG6wvrxmXwqc5fwr8ezNDm6FraT"

name: FtbBallot
safemethods:
  - tally
  - voted
  - numOptions
  - root
events:
  - name: Configured
    parameters:
      - name: root
        type: ByteArray
      - name: numOptions
        type: Integer
  - name: Voted
    parameters:
      - name: account
        type: Hash160
      - name: option
        type: Integer
      - name: weight
        type: Integer
permissions: []

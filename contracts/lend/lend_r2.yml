name: FtbLendR2
safemethods:
  - debtOf
  - collateralValue
  - collateralOf
  - maxBorrow
  - isUnhealthy
  - sharesOf
  - totalShares
  - totalBorrows
  - utilizationBps
  - borrowRatePerBlock
  - supplyRatePerBlock
  - borrowApyBps
  - supplyApyBps
  - reserveAccrued
  - liquidationsOf
  - pendingUpgradeEta
events:
  - name: Configured
    parameters:
      - name: registry
        type: Hash160
      - name: ftb
        type: Hash160
  - name: RiskSet
    parameters:
      - name: ltv
        type: Integer
      - name: liq
        type: Integer
      - name: bonus
        type: Integer
  - name: RatesSet
    parameters:
      - name: base
        type: Integer
      - name: slope1
        type: Integer
      - name: slope2
        type: Integer
      - name: kink
        type: Integer
      - name: reserveBps
        type: Integer
  - name: DividendsSwept
    parameters:
      - name: to
        type: Hash160
      - name: amount
        type: Integer
  - name: TreasurySwept
    parameters:
      - name: to
        type: Hash160
      - name: amount
        type: Integer
  - name: Liquidated
    parameters:
      - name: borrower
        type: Hash160
      - name: repaid
        type: Integer
      - name: seizedNeo
        type: Integer
      - name: seizedGas
        type: Integer
  - name: UpgradeProposed
    parameters:
      - name: eta
        type: Integer
  - name: UpgradeCancelled
    parameters: []
permissions:
  - contract: '*'
    methods:
      - transfer
      - balanceOf
      - price
      - get
      - onNEP17Payment
      # native ContractManagement.update, invoked only by ApplyUpgrade after the on-chain
      # self-timelock (C2 remediation): no bare one-call Update remains.
      - update

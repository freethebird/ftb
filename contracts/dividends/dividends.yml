name: FtbDividends
safemethods:
  - pendingOf
  - stakedOf
  - totalStaked
  - unlockHeightOf
  - accPerShare
  - queued
  - token
  - monthIndex
  - monthTotal
  - totalReceived
  - pendingUpgradeEta
events:
  - name: Configured
    parameters:
      - name: ftb
        type: Hash160
  - name: Received
    parameters:
      - name: from
        type: Hash160
      - name: amount
        type: Integer
  - name: Distributed
    parameters:
      - name: amount
        type: Integer
      - name: totalStaked
        type: Integer
  - name: Queued
    parameters:
      - name: amount
        type: Integer
  - name: Staked
    parameters:
      - name: user
        type: Hash160
      - name: amount
        type: Integer
  - name: Unstaked
    parameters:
      - name: user
        type: Hash160
      - name: amount
        type: Integer
  - name: Claimed
    parameters:
      - name: user
        type: Hash160
      - name: amount
        type: Integer
  - name: UpgradeProposed
    parameters:
      - name: eta
        type: Integer
  - name: UpgradeCancelled
    parameters: []
permissions:
  - contract: '*'
    methods:
      - transfer
      - balanceOf
      # native ContractManagement.update, invoked only by ApplyUpgrade after the on-chain
      # self-timelock (C3/D-1 remediation): no bare one-call Update remains.
      - update

name: FtbRegistry
safemethods:
  - get
  - delay
  - finished
  - proposalCount
  - proposalBond
  - escrow
  - proposal
events:
  - name: DelaySet
    parameters:
      - name: blocks
        type: Integer
  - name: Bootstrapped
    parameters:
      - name: name
        type: String
      - name: value
        type: Hash160
  - name: BootstrapFinished
  - name: Proposed
    parameters:
      - name: name
        type: String
      - name: value
        type: Hash160
      - name: eta
        type: Integer
  - name: Applied
    parameters:
      - name: name
        type: String
      - name: value
        type: Hash160
  - name: Cancelled
    parameters:
      - name: name
        type: String
  - name: DelayIncreased
    parameters:
      - name: blocks
        type: Integer
  - name: ProposalBondSet
    parameters:
      - name: amount
        type: Integer
  - name: ProposalSubmitted
    parameters:
      - name: id
        type: Integer
      - name: kind
        type: String
      - name: ref
        type: Hash160
      - name: proposer
        type: Hash160
      - name: bond
        type: Integer
  - name: ProposalClosed
    parameters:
      - name: id
        type: Integer
      - name: refund
        type: Boolean
      - name: to
        type: Hash160
      - name: amount
        type: Integer
permissions:
  - contract: '*'
    methods:
      - transfer
